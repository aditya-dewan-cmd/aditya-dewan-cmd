<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">Aditya Dewan automotive animated hero</title>
  <desc id="desc">A front-facing black performance coupe rendered in vector form, closely matching the supplied reference: low camera angle, broad hood, twin kidney grille, and bright yellow double-ring headlights.</desc>

  <defs>
    <linearGradient id="bg" x2="0" y2="1">
      <stop offset="0" stop-color="#101010"/>
      <stop offset="0.58" stop-color="#080808"/>
      <stop offset="1" stop-color="#020202"/>
    </linearGradient>

    <linearGradient id="hood" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a3a"/>
      <stop offset="0.20" stop-color="#242424"/>
      <stop offset="0.58" stop-color="#101010"/>
      <stop offset="1" stop-color="#030303"/>
    </linearGradient>

    <linearGradient id="bumper" x2="0" y2="1">
      <stop offset="0" stop-color="#191919"/>
      <stop offset="1" stop-color="#010101"/>
    </linearGradient>

    <linearGradient id="glass" x2="0" y2="1">
      <stop offset="0" stop-color="#202020"/>
      <stop offset="0.55" stop-color="#0b0b0b"/>
      <stop offset="1" stop-color="#020202"/>
    </linearGradient>

    <linearGradient id="metal" x2="0" y2="1">
      <stop offset="0" stop-color="#555"/>
      <stop offset="0.3" stop-color="#181818"/>
      <stop offset="1" stop-color="#030303"/>
    </linearGradient>

    <filter id="yellowGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>

    <clipPath id="leftLamp">
      <path d="M75 365 C90 322 137 294 205 292 C270 290 326 310 375 343 L352 421 C285 438 177 435 93 406 Z"/>
    </clipPath>
    <clipPath id="rightLamp">
      <path d="M1025 343 C1074 310 1130 290 1195 292 C1263 294 1310 322 1325 365 L1307 406 C1223 435 1115 438 1048 421 Z"/>
    </clipPath>
  </defs>

  <!-- dark photographic-style background -->
  <rect width="1400" height="650" fill="url(#bg)"/>
  <ellipse cx="700" cy="615" rx="620" ry="55" fill="#000" opacity=".95"/>
  <ellipse cx="210" cy="530" rx="230" ry="35" fill="#e6b800" opacity=".10" filter="url(#softGlow)"/>
  <ellipse cx="1190" cy="530" rx="230" ry="35" fill="#e6b800" opacity=".10" filter="url(#softGlow)"/>

  <!-- windshield / roof silhouette -->
  <path d="M275 286 C355 164 465 113 700 108 C935 113 1045 164 1125 286
           L1040 324 L360 324 Z" fill="#060606" stroke="#252525" stroke-width="5"/>
  <path d="M330 278 C405 188 500 145 700 140 C900 145 995 188 1070 278
           L1012 297 L388 297 Z" fill="url(#glass)" stroke="#333" stroke-width="3"/>
  <path d="M370 279 C460 205 550 177 700 174 C850 177 940 205 1030 279"
        fill="none" stroke="#4a4a4a" stroke-width="4" opacity=".35"/>

  <!-- hood: broad, low, sculpted like reference -->
  <path d="M112 365
           C190 302 303 275 430 268
           C535 261 615 256 700 256
           C785 256 865 261 970 268
           C1097 275 1210 302 1288 365
           L1318 438
           C1160 470 995 480 700 481
           C405 480 240 470 82 438 Z"
        fill="url(#hood)" stroke="#3b3b3b" stroke-width="4"/>

  <!-- hood central crease -->
  <path d="M700 257 L700 424" stroke="#555" stroke-width="3" opacity=".30"/>
  <path d="M190 343 C335 315 460 304 570 300" fill="none" stroke="#777" stroke-width="5" opacity=".13"/>
  <path d="M1210 343 C1065 315 940 304 830 300" fill="none" stroke="#777" stroke-width="5" opacity=".13"/>

  <!-- outer body / fenders -->
  <path d="M55 420 C70 350 150 318 245 319 L390 355 L365 442
           C280 468 171 472 75 454 Z" fill="#0b0b0b" stroke="#303030" stroke-width="4"/>
  <path d="M1345 420 C1330 350 1250 318 1155 319 L1010 355 L1035 442
           C1120 468 1229 472 1325 454 Z" fill="#0b0b0b" stroke="#303030" stroke-width="4"/>

  <!-- headlights housings -->
  <path d="M75 365 C90 322 137 294 205 292 C270 290 326 310 375 343
           L352 421 C285 438 177 435 93 406 Z"
        fill="#111" stroke="#4c4c4c" stroke-width="5"/>
  <path d="M1025 343 C1074 310 1130 290 1195 292 C1263 294 1310 322 1325 365
           L1307 406 C1223 435 1115 438 1048 421 Z"
        fill="#111" stroke="#4c4c4c" stroke-width="5"/>

  <!-- headlight inner darkness -->
  <g clip-path="url(#leftLamp)" opacity=".92">
    <rect x="70" y="285" width="315" height="150" fill="#050505"/>
    <g stroke="#555" stroke-width="3" opacity=".55">
      <path d="M170 320V395 M205 313V405 M240 312V405 M275 318V398"/>
    </g>
  </g>
  <g clip-path="url(#rightLamp)" opacity=".92">
    <rect x="1015" y="285" width="315" height="150" fill="#050505"/>
    <g stroke="#555" stroke-width="3" opacity=".55">
      <path d="M1230 320V395 M1195 313V405 M1160 312V405 M1125 318V398"/>
    </g>
  </g>

  <!-- yellow halo glow behind DRLs -->
  <g fill="none" stroke="#ffd400" stroke-width="24" opacity=".16" filter="url(#yellowGlow)">
    <path d="M100 365 C116 330 151 314 198 315 C245 316 277 329 305 354
             C286 384 258 399 218 401 C169 403 131 391 100 365 Z"/>
    <path d="M1095 354 C1123 329 1155 316 1202 315 C1249 314 1284 330 1300 365
             C1269 391 1231 403 1182 401 C1142 399 1114 384 1095 354 Z"/>
  </g>

  <!-- exact-style double yellow DRL signatures -->
  <g fill="none" stroke="#ffd400" stroke-linecap="round" stroke-linejoin="round"
     filter="url(#yellowGlow)">
    <!-- left inner ring -->
    <path id="leftDRL1" d="M104 360 C113 334 137 322 168 322 C199 322 220 333 230 355
                             C220 379 199 391 168 391 C137 391 113 379 104 360 Z"
          stroke-width="11"/>
    <!-- left outer ring -->
    <path id="leftDRL2" d="M208 359 C217 334 241 322 271 324 C301 326 326 338 340 358
                             C326 382 301 393 271 393 C241 393 217 381 208 359 Z"
          stroke-width="11"/>

    <!-- right outer ring -->
    <path id="rightDRL1" d="M1060 358 C1074 338 1099 326 1129 324 C1159 322 1183 334 1192 359
                             C1183 381 1159 393 1129 393 C1099 393 1074 382 1060 358 Z"
          stroke-width="11"/>
    <!-- right inner ring -->
    <path id="rightDRL2" d="M1170 355 C1180 333 1201 322 1232 322 C1263 322 1287 334 1296 360
                             C1287 379 1263 391 1232 391 C1201 391 1180 379 1170 355 Z"
          stroke-width="11"/>
  </g>

  <!-- startup sweep: headlights turn on sequentially -->
  <g fill="none" stroke="#fff3a1" stroke-linecap="round" opacity=".9">
    <path d="M104 360 C113 334 137 322 168 322 C199 322 220 333 230 355
             C220 379 199 391 168 391 C137 391 113 379 104 360 Z" stroke-width="3">
      <animate attributeName="stroke-dasharray" values="0 400;400 0;400 0" dur="3.8s" repeatCount="indefinite"/>
    </path>
    <path d="M208 359 C217 334 241 322 271 324 C301 326 326 338 340 358
             C326 382 301 393 271 393 C241 393 217 381 208 359 Z" stroke-width="3">
      <animate attributeName="stroke-dasharray" values="0 400;400 0;400 0" begin=".22s" dur="3.8s" repeatCount="indefinite"/>
    </path>
    <path d="M1060 358 C1074 338 1099 326 1129 324 C1159 322 1183 334 1192 359
             C1183 381 1159 393 1129 393 C1099 393 1074 382 1060 358 Z" stroke-width="3">
      <animate attributeName="stroke-dasharray" values="0 400;400 0;400 0" begin=".22s" dur="3.8s" repeatCount="indefinite"/>
    </path>
    <path d="M1170 355 C1180 333 1201 322 1232 322 C1263 322 1287 334 1296 360
             C1287 379 1263 391 1232 391 C1201 391 1180 379 1170 355 Z" stroke-width="3">
      <animate attributeName="stroke-dasharray" values="0 400;400 0;400 0" begin="0.44s" dur="3.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- kidney grille: full central pair -->
  <g>
    <path d="M385 324 C440 294 535 292 620 309
             C646 315 654 338 648 370
             L630 420 C570 438 478 438 422 420
             C402 392 390 356 385 324 Z"
          fill="#030303" stroke="#555" stroke-width="7"/>
    <path d="M780 309 C865 292 960 294 1015 324
             C1010 356 998 392 978 420
             C922 438 830 438 770 420
             L752 370 C746 338 754 315 780 309 Z"
          fill="#030303" stroke="#555" stroke-width="7"/>

    <!-- grille vertical slats -->
    <g stroke="#242424" stroke-width="7" opacity=".95">
      <path d="M414 325 L430 414 M445 311 L458 427 M478 305 L487 431 M512 301 L518 433
               M547 299 L550 434 M582 301 L582 433 M616 306 L610 431 M643 315 L635 420"/>
      <path d="M757 315 L765 420 M784 306 L790 431 M818 301 L818 433 M853 299 L850 434
               M888 301 L882 433 M922 305 L913 431 M955 311 L942 427 M986 325 L970 414"/>
    </g>
  </g>

  <!-- subtle center badge -->
  <g transform="translate(700 281)">
    <circle r="29" fill="#080808" stroke="#777" stroke-width="4"/>
    <circle r="23" fill="#111" stroke="#222" stroke-width="2"/>
    <path d="M0-21 A21 21 0 0 1 21 0 L0 0Z" fill="#dfe8f5"/>
    <path d="M21 0 A21 21 0 0 1 0 21 L0 0Z" fill="#315a9a"/>
    <path d="M0 21 A21 21 0 0 1-21 0 L0 0Z" fill="#dfe8f5"/>
    <path d="M-21 0 A21 21 0 0 1 0-21 L0 0Z" fill="#315a9a"/>
  </g>>


  <!-- DRL pulse: the light signature breathes after startup -->
  <g fill="none" stroke="#ffd400" stroke-width="5" opacity=".75" filter="url(#yellowGlow)">
    <use href="#leftDRL1"><animate attributeName="opacity" values=".35;1;.35" dur="2.2s" begin="1s" repeatCount="indefinite"/></use>
    <use href="#leftDRL2"><animate attributeName="opacity" values=".25;0.9;.25" dur="2.2s" begin="1.2s" repeatCount="indefinite"/></use>
    <use href="#rightDRL1"><animate attributeName="opacity" values=".25;0.9;.25" dur="2.2s" begin="1.2s" repeatCount="indefinite"/></use>
    <use href="#rightDRL2"><animate attributeName="opacity" values=".35;1;.35" dur="2.2s" begin="1s" repeatCount="indefinite"/></use>
  </g>

  <!-- bumper / lower intake -->
  <path d="M78 432 C180 450 315 463 420 455
           C520 447 615 444 700 444
           C785 444 880 447 980 455
           C1085 463 1220 450 1322 432
           L1350 535
           C1230 570 1085 584 930 579
           C820 575 760 568 700 568
           C640 568 580 575 470 579
           C315 584 170 570 50 535 Z"
        fill="url(#bumper)" stroke="#292929" stroke-width="5"/>

  <!-- lower central intake -->
  <path d="M400 493 C485 474 585 469 700 469
           C815 469 915 474 1000 493
           L948 548 C866 560 790 561 700 561
           C610 561 534 560 452 548 Z"
        fill="#010101" stroke="#111" stroke-width="5"/>

  <!-- side intakes -->
  <path d="M92 475 C155 463 218 462 276 474 L335 528
           C265 541 186 540 115 526 Z" fill="#020202" stroke="#151515" stroke-width="5"/>
  <path d="M1124 474 C1182 462 1245 463 1308 475 L1285 526
           C1214 540 1135 541 1065 528 Z" fill="#020202" stroke="#151515" stroke-width="5"/>

  <!-- front lip -->
  <path d="M45 535 C210 570 355 578 470 574
           C570 570 625 563 700 563
           C775 563 830 570 930 574
           C1045 578 1190 570 1355 535"
        fill="none" stroke="#484848" stroke-width="8" opacity=".65"/>

  <!-- title overlay, intentionally subtle so the car remains dominant -->
  <g text-anchor="middle" font-family="Arial, Helvetica, sans-serif">
    <text x="700" y="76" fill="#ffffff" font-size="36" letter-spacing="11" font-weight="700">ADITYA.DEWAN</text>
    <text x="700" y="103" fill="#d4b900" font-size="12" letter-spacing="5">SOFTWARE • AI/ML • AUTOMOTIVE • IoT • CLOUD</text>
  </g>

  <!-- tiny ignition indicator -->
  <g font-family="monospace" font-size="11" letter-spacing="3">
    <text x="55" y="55" fill="#d4b900">LIGHT SIGNATURE / ONLINE</text>
    <circle cx="1315" cy="51" r="4" fill="#ffd400">
      <animate attributeName="opacity" values=".25;1;.25" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
