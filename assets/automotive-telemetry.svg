<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300">
<defs>
 <linearGradient id="bg" x2="1"><stop stop-color="#090817"/><stop offset="1" stop-color="#171127"/></linearGradient>
 <linearGradient id="road" x2="1"><stop stop-color="#151323"/><stop offset=".5" stop-color="#29233c"/><stop offset="1" stop-color="#151323"/></linearGradient>
 <style>
  .t{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.road{animation:move 1.2s linear infinite}.car{animation:bob .45s ease-in-out infinite alternate}
  @keyframes move{to{transform:translateX(-90px)}} @keyframes bob{to{transform:translateY(-3px)}}
  @media(prefers-reduced-motion:reduce){.road,.car{animation:none}}
 </style>
</defs>
<rect width="1000" height="300" rx="24" fill="url(#bg)" stroke="#6f5aa8" stroke-opacity=".5"/>
<text x="42" y="43" class="t" fill="#cbbcf7" font-size="13" letter-spacing="4">ADITYA.DEWAN // AUTO LAB</text>
<text x="42" y="76" class="t" fill="#fff" font-size="28" font-weight="700">VEHICLE TELEMETRY</text>
<text x="42" y="98" class="t" fill="#9d93b8" font-size="12">LIVE SIMULATION • AUTOMOTIVE SOFTWARE • IoT</text>
<rect x="42" y="120" width="570" height="125" rx="16" fill="url(#road)" stroke="#4e426d"/>
<g class="road"><path d="M-100 190H700" stroke="#d9d0ed" stroke-width="4" stroke-dasharray="42 28" opacity=".45"/></g>
<g class="car">
 <path d="M260 197l20-30h74l25 30v27H260z" fill="#9b7bdc" stroke="#ded2ff" stroke-width="2"/>
 <path d="M286 168h42l13 20h-68z" fill="#211b34" stroke="#bca9ef"/>
 <circle cx="286" cy="224" r="13" fill="#0b0912" stroke="#d9d0ed" stroke-width="3"/>
 <circle cx="354" cy="224" r="13" fill="#0b0912" stroke="#d9d0ed" stroke-width="3"/>
</g>
<g class="t">
 <text x="660" y="135" fill="#9d93b8" font-size="11">SPEED</text><text x="660" y="162" fill="#fff" font-size="25" font-weight="700">087 <tspan fill="#9d93b8" font-size="11">km/h</tspan></text>
 <text x="825" y="135" fill="#9d93b8" font-size="11">RPM</text><text x="825" y="162" fill="#fff" font-size="25" font-weight="700">3.4k</text>
 <text x="660" y="196" fill="#9d93b8" font-size="11">ENGINE TEMP</text><text x="660" y="221" fill="#d7b5ff" font-size="20" font-weight="700">91°C</text>
 <text x="825" y="196" fill="#9d93b8" font-size="11">FUEL</text><text x="825" y="221" fill="#b9f2d0" font-size="20" font-weight="700">78%</text>
</g>
<rect x="42" y="264" width="916" height="3" rx="2" fill="#9b7bdc" opacity=".7"/>
</svg>
